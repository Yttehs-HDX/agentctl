[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentctl"
version = "0.3.0"
description = "Thin convenience CLI over Herdr Core for Agents running Worker pools"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12.3",
    "pydantic>=2.7",
]

[project.scripts]
agentctl = "agentctl.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/agentctl"]

[tool.hatch.build.targets.wheel.force-include]
"skills/agentctl-leader" = "agentctl/skills/agentctl-leader"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
