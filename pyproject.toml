[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentctl"
version = "0.1.0"
description = "Workspace-scoped agent session manager on top of Herdr Core"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12.3",
    "pydantic>=2.7",
    "tomli-w>=1.0.0",
]

[project.scripts]
agentctl = "agentctl.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/agentctl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
